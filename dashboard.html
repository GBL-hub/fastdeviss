<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastDevis — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:system-ui,sans-serif}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f4f6fb;color:#0f1923;overflow-x:hidden}

/* ── PLAN SELECTOR (demo) ── */
.plan-bar{background:#0f1923;padding:10px 20px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.plan-bar span{color:rgba(255,255,255,.5);font-size:.78rem}
.plan-btn{padding:6px 16px;border-radius:100px;border:1.5px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:.78rem;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s}
.plan-btn.active{background:#ff6b2b;color:#fff;border-color:#ff6b2b}
.plan-btn:hover:not(.active){background:rgba(255,255,255,.1);color:#fff}

/* ── LAYOUT ── */
.app{display:flex;height:calc(100vh - 40px)}

/* ── SIDEBAR ── */
.sidebar{width:240px;background:#0f1923;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-text{font-family:'Bricolage Grotesque',sans-serif;font-size:1.4rem;font-weight:800;color:#fff;letter-spacing:-.03em}
.logo-text span{color:#ff6b2b}
.plan-badge{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:100px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.badge-starter{background:rgba(26,107,250,.2);color:#7ab4ff}
.badge-pro{background:rgba(255,107,43,.2);color:#ffb088}
.badge-premium{background:rgba(139,92,246,.25);color:#c4b5fd}

.sidebar-nav{flex:1;padding:12px 10px}
.nav-section{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);padding:10px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;color:rgba(255,255,255,.5);font-size:.84rem;font-weight:500;margin-bottom:1px;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'Plus Jakarta Sans',sans-serif}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.nav-item.active{background:rgba(26,107,250,.25);color:#fff}
.nav-item.locked{opacity:.4;cursor:not-allowed}
.nav-item.locked:hover{background:none;color:rgba(255,255,255,.4)}
.lock-icon{width:12px;height:12px;stroke:rgba(255,255,255,.4);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-left:auto;flex-shrink:0}

.sidebar-upgrade{margin:12px 10px;background:linear-gradient(135deg,#ff6b2b,#ff4500);border-radius:12px;padding:14px;cursor:pointer}
.upgrade-title{font-size:.82rem;font-weight:700;color:#fff;margin-bottom:3px}
.upgrade-sub{font-size:.72rem;color:rgba(255,255,255,.75)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f5;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;box-shadow:0 1px 8px rgba(26,107,250,.06)}
.topbar-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1rem;color:#0f1923}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn-new{background:#ff6b2b;color:#fff;padding:8px 18px;border-radius:100px;font-size:.82rem;font-weight:700;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}

.content{flex:1;overflow-y:auto;padding:20px 24px}

/* ── VIEWS ── */
.view{display:none}
.view.active{display:block}

/* ── LOCK OVERLAY ── */
.locked-view{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;min-height:400px}
.locked-icon{width:64px;height:64px;border-radius:16px;background:#e8f0ff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.locked-icon svg{width:28px;height:28px;stroke:#1a6bfa;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.locked-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.2rem;margin-bottom:8px}
.locked-sub{font-size:.875rem;color:#7a8fa6;margin-bottom:20px;max-width:360px;line-height:1.6}
.locked-upgrade-btn{background:#ff6b2b;color:#fff;padding:12px 28px;border-radius:100px;font-weight:700;font-size:.875rem;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;text-decoration:none;display:inline-block}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:14px;border:1px solid #e2e8f5;padding:16px 18px;box-shadow:0 2px 8px rgba(26,107,250,.05)}
.stat-label{font-size:.72rem;font-weight:600;color:#7a8fa6;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-family:'Bricolage Grotesque',sans-serif;font-size:1.8rem;font-weight:800;color:#0f1923;line-height:1}
.stat-sub{font-size:.72rem;margin-top:5px;font-weight:600}
.stat-up{color:#00c48c}.stat-warn{color:#f59e0b}.stat-muted{color:#7a8fa6}
.stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.stat-icon svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── CARDS ── */
.card{background:#fff;border-radius:14px;border:1px solid #e2e8f5;box-shadow:0 2px 8px rgba(26,107,250,.05);margin-bottom:16px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid #e2e8f5;display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.9rem;color:#0f1923}
.card-body{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ── TABLE ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a8fa6;padding:9px 14px;text-align:left;border-bottom:1px solid #e2e8f5;white-space:nowrap;background:#fafbff}
td{padding:11px 14px;font-size:.84rem;color:#3d4f60;border-bottom:1px solid #e2e8f5;vertical-align:middle}
tr:last-child td{border:none}
tr:hover td{background:#fafbff}
.td-name{font-weight:700;color:#0f1923}
.blur-name{filter:blur(4px);user-select:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:100px}
.badge::before{content:'';width:5px;height:5px;border-radius:50%}
.b-signed{background:#e0fff5;color:#007a59}.b-signed::before{background:#00c48c}
.b-pending{background:#fff7e0;color:#b45309}.b-pending::before{background:#f59e0b}
.b-sent{background:#e8f0ff;color:#1a6bfa}.b-sent::before{background:#1a6bfa}
.b-refused{background:#fee2e2;color:#b91c1c}.b-refused::before{background:#ef4444}
.action-btns{display:flex;gap:5px}
.btn-sm{padding:5px 12px;border-radius:8px;font-size:.72rem;font-weight:600;border:1.5px solid #e2e8f5;background:#fff;color:#3d4f60;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}
.btn-sm:hover{border-color:#1a6bfa;color:#1a6bfa}
.btn-sm.green{background:#00c48c;color:#fff;border-color:#00c48c}
.btn-sm.orange{background:#ff6b2b;color:#fff;border-color:#ff6b2b}

/* ── DEVIS FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#3d4f60}
.form-group input,.form-group textarea,.form-group select{padding:9px 12px;border:1.5px solid #e2e8f5;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;color:#0f1923;background:#f7f9ff;outline:none;transition:border-color .2s;resize:none;width:100%}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#1a6bfa;background:#fff;box-shadow:0 0 0 3px rgba(26,107,250,.08)}
.form-group.span2{grid-column:span 2}
.locked-field{background:#f0f0f0!important;color:#b0bac9!important;cursor:not-allowed;position:relative}
.field-lock-wrap{position:relative}
.field-lock-wrap svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#c0ccd8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* LINE TABLE */
.lines-tbl{width:100%;border-collapse:collapse;margin-bottom:10px}
.lines-tbl th{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a8fa6;padding:7px 8px;background:#f7f9ff;text-align:left}
.lines-tbl td{padding:5px 5px}
.line-input{padding:7px 9px;font-size:.82rem;border:1.5px solid #e2e8f5;border-radius:8px;background:#f7f9ff;font-family:'Plus Jakarta Sans',sans-serif;color:#0f1923;width:100%}
.line-input:focus{outline:none;border-color:#1a6bfa;background:#fff}
.del-btn{width:26px;height:26px;border-radius:6px;border:none;background:#fee2e2;color:#ef4444;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.del-btn:hover{background:#ef4444;color:#fff}
.totals-box{background:#f7f9ff;border-radius:10px;padding:14px 16px;border:1px solid #e2e8f5;margin-bottom:12px}
.total-row{display:flex;justify-content:space-between;font-size:.84rem;color:#3d4f60;padding:3px 0}
.total-row.main{padding-top:10px;margin-top:6px;border-top:2px solid #1a6bfa;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1rem;color:#0f1923}
.total-row.ttc{border-top:2px solid #ff6b2b;color:#ff6b2b;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.05rem;margin-top:5px;padding-top:8px}

/* SEND PANEL */
.send-row{display:flex;gap:8px;margin-bottom:12px}
.send-card{flex:1;padding:12px 10px;border-radius:11px;border:1.5px solid #e2e8f5;background:#fff;cursor:pointer;text-align:center;transition:all .2s}
.send-card:hover{transform:translateY(-2px)}
.sc-icon{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.sc-icon svg{width:18px;height:18px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sc-wa .sc-icon{background:#e8f5e9}.sc-wa .sc-icon svg{stroke:#25d366}
.sc-wa:hover{border-color:#25d366}
.sc-sms .sc-icon{background:#e8f0ff}.sc-sms .sc-icon svg{stroke:#1a6bfa}
.sc-sms:hover{border-color:#1a6bfa}
.sc-email .sc-icon{background:#fff0e8}.sc-email .sc-icon svg{stroke:#ff6b2b}
.sc-email:hover{border-color:#ff6b2b}
.sc-label{font-size:.72rem;font-weight:700;color:#3d4f60}
.sc-locked{opacity:.4;cursor:not-allowed}
.sc-locked:hover{transform:none;border-color:#e2e8f5}

/* ACCEPT ZONE */
.accept-zone{background:#f0fff9;border:1.5px solid #00c48c;border-radius:12px;padding:14px;text-align:center;margin-bottom:12px}
.accept-btn{background:#00c48c;color:#fff;border:none;padding:11px 20px;border-radius:100px;font-weight:700;font-size:.84rem;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;width:100%}
.accept-btn:hover{background:#00a878}

/* RELANCE ROWS */
.relance-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f7f9ff;border-radius:10px;border:1px solid #e2e8f5;margin-bottom:7px}
.relance-dot{width:28px;height:28px;border-radius:50%;background:#1a6bfa;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.relance-dot svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* QUICK btns */
.quick-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.quick-btn{padding:5px 12px;border-radius:100px;font-size:.72rem;font-weight:600;border:1.5px solid #e2e8f5;background:#fff;color:#3d4f60;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif}
.quick-btn:hover{background:#1a6bfa;color:#fff;border-color:#1a6bfa}

/* CRM */
.client-card{background:#fff;border:1px solid #e2e8f5;border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;transition:box-shadow .2s}
.client-card:hover{box-shadow:0 4px 16px rgba(26,107,250,.1)}
.client-av{width:38px;height:38px;border-radius:50%;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.85rem;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ca-blue{background:#1a6bfa}.ca-orange{background:#ff6b2b}.ca-green{background:#00c48c}.ca-purple{background:#8b5cf6}.ca-pink{background:#ec4899}

/* USAGE BAR */
.usage-bar-wrap{background:#f7f9ff;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.usage-label{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:8px}
.usage-label span:first-child{font-weight:600;color:#0f1923}
.usage-label span:last-child{color:#7a8fa6}
.usage-track{height:8px;background:#e2e8f5;border-radius:100px;overflow:hidden}
.usage-fill{height:100%;border-radius:100px;transition:width .5s ease}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:#0f1923;color:#fff;padding:11px 16px;border-radius:11px;font-size:.82rem;font-weight:600;z-index:9999;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateY(0)}
.toast-g{border-left:4px solid #00c48c}
.toast-b{border-left:4px solid #1a6bfa}
.toast-o{border-left:4px solid #ff6b2b}

/* VOCAL / PHOTO btns (premium) */
.premium-feat{display:flex;gap:10px;margin-bottom:14px}
.pfeat-btn{flex:1;padding:14px;border-radius:12px;border:1.5px solid #e2e8f5;background:#fff;cursor:pointer;text-align:center;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif}
.pfeat-btn:hover{border-color:#8b5cf6;background:#faf5ff}
.pfeat-icon{font-size:1.5rem;margin-bottom:6px}
.pfeat-label{font-size:.78rem;font-weight:700;color:#0f1923}
.pfeat-sub{font-size:.68rem;color:#7a8fa6;margin-top:2px}

/* FACTURATION TABLE */
.invoice-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #e2e8f5}
.invoice-row:last-child{border:none}
.invoice-num{font-weight:700;font-size:.84rem;color:#0f1923}
.invoice-date{font-size:.76rem;color:#7a8fa6}
.invoice-amount{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.9rem}
.invoice-status{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:100px;background:#e0fff5;color:#007a59}
.btn-dl{padding:5px 12px;background:#e8f0ff;color:#1a6bfa;border:none;border-radius:7px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}

/* MOBILE */
@media(max-width:768px){
  .sidebar{display:none}
  .stats-row{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .form-group.span2{grid-column:span 1}
  .send-row{flex-direction:column}
  .content{padding:14px}
  .topbar{padding:0 14px}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- PLAN SELECTOR -->
<!-- Plan bar hidden for production - plan detected from URL -->
<div id="plan-bar-demo" style="background:#0f1923;padding:8px 20px;display:flex;align-items:center;gap:10px;justify-content:center;font-size:.74rem;color:rgba(255,255,255,.4)">
  <span>Aperçu multi-plan (landing) :</span>
  <button class="plan-btn active" onclick="setPlan('starter')">Starter</button>
  <button class="plan-btn" onclick="setPlan('pro')">Pro</button>
  <button class="plan-btn" onclick="setPlan('premium')">Premium</button>
</div>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text">Fast<span>Devis</span></div>
      <div class="plan-badge badge-starter" id="sidebar-badge">Starter</div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- filled by JS -->
    </nav>
    <div class="sidebar-upgrade" id="sidebar-upgrade" onclick="toast_show('Accédez au plan supérieur sur fastdeviss.vercel.app','o')" style="display:none">
      <div class="upgrade-title">Passer au Pro</div>
      <div class="upgrade-sub">Débloquez toutes les fonctions</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Tableau de bord</div>
      <div class="topbar-right">
        <button class="btn-new" onclick="showView('nouveau')">+ Nouveau devis</button>
      </div>
    </div>
    <div class="content" id="content">
      <!-- views injected -->
    </div>
  </div>
</div>

<script>
// ═══════════════════════
// DATA & STATE
// ═══════════════════════
let plan = 'starter';
let lineCounter = 0;

const PLANS = {

    }

};

const DEVIS_DATA = [

const CLIENTS = [

  {initials:'SL',nom:'Sophie Laurent',color:'ca-orange',adresse:'Paris 75011',devis:1,ca:979},
  {initials:'JM',nom:'Jean Moreau',color:'ca-green',adresse:'Bordeaux 33000',devis:2,ca:4200},
  {initials:'AP',nom:'Anne Petit',color:'ca-purple',adresse:'Marseille 13002',devis:1,ca:374},
  {initials:'PB',nom:'Paul Bernard',color:'ca-pink',adresse:'Nantes 44000',devis:2,ca:3800},
];

const quickTemplates = {
  plombier:[
    {label:'Fuite évier',lines:[{d:'Diagnostic fuite',q:1,u:'forfait',p:60},{d:'Remplacement joint',q:1,u:'forfait',p:80},{d:'Robinet mitigeur',q:1,u:'u',p:120},{d:'Déplacement',q:1,u:'forfait',p:40}]},
    {label:'Chauffe-eau',lines:[{d:'Dépose ancien chauffe-eau',q:1,u:'forfait',p:120},{d:'Fourniture 200L',q:1,u:'u',p:650},{d:'Pose raccordements',q:1,u:'forfait',p:280},{d:'Déplacement',q:1,u:'forfait',p:40}]},

function planLevel(p){return{starter:0,pro:1,premium:2}[p]}

function buildNav(){
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  let lastSection = '';
  NAV_ITEMS.forEach(item=>{
    const accessible = planLevel(plan) >= planLevel(item.plan==='all'?'starter':item.plan);
    if(item.section && item.section!==lastSection){
      lastSection=item.section;
      const s=document.createElement('div');
      s.className='nav-section';s.textContent=item.section;nav.appendChild(s);
    }
    const btn=document.createElement('button');
    btn.className='nav-item'+(accessible?'':' locked');
    btn.onclick=accessible?()=>showView(item.id):()=>toast_show('Disponible avec le plan '+(item.plan==='pro'?'Pro':'Premium'),'o');
    btn.innerHTML=`<svg viewBox="0 0 24 24">${item.icon}</svg>${item.label}${!accessible?'<svg class="lock-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>':''}`;
    nav.appendChild(btn);
  });
}

function showView(id){
  document.getElementById('topbar-title').textContent = NAV_ITEMS.find(n=>n.id===id)?.label||'Dashboard';
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.remove('active');
    if(n.textContent.trim().startsWith(NAV_ITEMS.find(x=>x.id===id)?.label?.slice(0,8)||'__')) n.classList.add('active');
  });
  const content = document.getElementById('content');

  const f = PLANS[plan].features;
  const accessible = {
    dashboard:true, nouveau:true, devis:true,
    clients:f.crm, relances:f.relances, signature:f.signature,
    vocal:f.vocal, photos:f.photos, facturation:f.facturation, stats:f.relances
  };

  if(!accessible[id]){
    const needPlan = ['clients','relances','signature','stats'].includes(id)?'Pro':'Premium';
    const upgradeLink = needPlan==='Pro'?'https://buy.stripe.com/aFacN5335gZl01w2rMffy03':'https://buy.stripe.com/8x23cveLN5gDeWq1nIffy02';
    content.innerHTML=`<div class="locked-view">
      <div class="locked-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h3 class="locked-title">Disponible avec le plan ${needPlan}</h3>
      <p class="locked-sub">Cette fonctionnalité est réservée aux abonnés ${needPlan}. Passez au plan supérieur pour y accéder immédiatement.</p>
      <a href="${upgradeLink}" target="_blank" class="locked-upgrade-btn">Passer au plan ${needPlan} →</a>
    </div>`;
    return;
  }

  // Render view
  if(id==='dashboard') renderDashboard(content);
  else if(id==='nouveau') renderNouveau(content);
  else if(id==='devis') renderDevis(content);
  else if(id==='clients') renderClients(content);
  else if(id==='relances') renderRelances(content);
  else if(id==='signature') renderSignature(content);
  else if(id==='vocal') renderVocal(content);
  else if(id==='photos') renderPhotos(content);
  else if(id==='facturation') renderFacturation(content);
  else if(id==='stats') renderStats(content);
}

function addLine(data=null){

  const tr=document.createElement('tr');

  tr.innerHTML=`<td><input class="line-input" placeholder="Prestation..." value="${data?data.d:''}" oninput="calcTotals()"></td>
  <td><input class="line-input" type="number" value="${data?data.q:1}" style="width:56px" oninput="calcTotals()"></td>
  <td><input class="line-input" value="${data?data.u:'u'}" style="width:52px"></td>
  <td><input class="line-input" type="number" value="${data?data.p:0}" style="width:70px" oninput="calcTotals()"></td>

  <td><button class="del-btn" onclick="document.getElementById('ln-${id}').remove();calcTotals()">×</button></td>`;
  document.getElementById('lines-body')?.appendChild(tr);
  calcTotals();
}

function calcTotals(){
  const rows=document.querySelectorAll('#lines-body tr');
  let ht=0;
  rows.forEach((tr,i)=>{
    const inputs=tr.querySelectorAll('input');
    const q=parseFloat(inputs[1]?.value)||0;
    const p=parseFloat(inputs[3]?.value)||0;
    const t=q*p; ht+=t;
    const el=document.getElementById('lt-'+i);
    if(el) el.textContent=Math.round(t).toLocaleString('fr-FR')+' €';
  });
  const tva=ht*.1,ttc=ht+tva;
  ['t-ht','t-total'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=Math.round(ht).toLocaleString('fr-FR')+' €'});
  const tvael=document.getElementById('t-tva');if(tvael)tvael.textContent=Math.round(tva).toLocaleString('fr-FR')+' €';
  const ttcel=document.getElementById('t-ttc');if(ttcel)ttcel.textContent=Math.round(ttc).toLocaleString('fr-FR')+' €';
}

}

// INIT — Auto-detect plan from URL
// ═══════════════════════
(function(){
  const params = new URLSearchParams(window.location.search);
  const urlPlan = params.get('plan');
  const stored = localStorage.getItem('fd_plan');
  
  // If plan in URL, save it
  if(urlPlan && ['starter','pro','premium'].includes(urlPlan)){
    localStorage.setItem('fd_plan', urlPlan);
  }
  
  const activePlan = urlPlan || stored || 'starter';
  
  // Hide demo selector if coming from Stripe (real user)
  if(urlPlan){
    const bar = document.getElementById('plan-bar-demo');
    if(bar) bar.style.display = 'none';
  }
  
  setPlan(activePlan);
})();
